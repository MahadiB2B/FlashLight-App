name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # জাভা সেটআপ (ফ্লাটার ৩.২২+ এর জন্য Java 17 বাধ্যতামূলক)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ফ্লাটার এসডিকে সেটআপ
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # লেটেস্ট স্টেবল ভার্সন ব্যবহার করবে
          channel: 'stable'

      # ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install dependencies
        run: flutter pub get

      # APK বিল্ড করা (Release মোডে)
      - name: Build APK
        run: flutter build apk --release

      # বিল্ড করা APK ফাইলটি GitHub Actions Artifact হিসেবে সেভ করে রাখা
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk